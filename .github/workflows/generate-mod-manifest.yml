name: Generate mod manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mods/**"
      - "config/**"
      - "defaultconfigs/**"
      - "resourcepacks/**"
      - "shaderpacks/**"
      - ".github/workflows/generate-mod-manifest.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate manifest.json
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import quote

          ROOT = Path(".")
          REPO = "Xgam236/SurvivalModded-data"
          BRANCH = "main"
          SECTIONS = (
              "mods",
              "config",
              "defaultconfigs",
              "resourcepacks",
              "shaderpacks",
          )

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          result = {
              "version": 2,
              "mods": [],
              "config": [],
              "defaultconfigs": [],
              "resourcepacks": [],
              "shaderpacks": [],
          }

          for section in SECTIONS:
              folder = ROOT / section

              if not folder.is_dir():
                  continue

              for file in sorted(folder.rglob("*")):
                  if not file.is_file() or file.name == ".gitkeep":
                      continue

                  relative = file.relative_to(folder).as_posix()
                  raw_path = quote(f"{section}/{relative}", safe="/")

                  result[section].append({
                      "name": file.name,
                      "path": relative,
                      "sha256": sha256(file),
                      "url": (
                          f"https://raw.githubusercontent.com/"
                          f"{REPO}/{BRANCH}/{raw_path}"
                      ),
                  })

          Path("manifest.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("manifest.json généré :")
          for section in SECTIONS:
              print(f"  {section:14} : {len(result[section])}")

      - name: Commit manifest.json
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- manifest.json; then
            echo "Aucune modification de manifest.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json
          git commit -m "Update manifest"
          git push

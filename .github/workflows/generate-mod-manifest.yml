name: Generate Mods Manifest

on:
  push:
    branches:
      - main
    paths:
      - "mods/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        shell: python
        run: |
          import os
          import json
          import hashlib
          import urllib.parse

          MODS_FOLDER = "mods"
          OUTPUT_FILE = "manifest.json"

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = "main"

          mods = []

          if os.path.isdir(MODS_FOLDER):
              for filename in sorted(os.listdir(MODS_FOLDER)):
                  if not filename.lower().endswith(".jar"):
                      continue

                  filepath = os.path.join(MODS_FOLDER, filename)

                  if not os.path.isfile(filepath):
                      continue

                  sha256 = hashlib.sha256()

                  with open(filepath, "rb") as f:
                      while True:
                          chunk = f.read(1024 * 1024)

                          if not chunk:
                              break

                          sha256.update(chunk)

                  encoded_filename = urllib.parse.quote(filename)

                  url = (
                      f"https://raw.githubusercontent.com/"
                      f"{repository}/{branch}/mods/{encoded_filename}"
                  )

                  mods.append({
                      "name": filename,
                      "sha256": sha256.hexdigest(),
                      "url": url
                  })

          manifest = {
              "version": 1,
              "mods": mods
          }

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)

          print(f"{len(mods)} mods ajoutés au manifest.")

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json

          if git diff --cached --quiet; then
            echo "Aucune modification du manifest."
            exit 0
          fi

          git commit -m "Update mods manifest"
          git push

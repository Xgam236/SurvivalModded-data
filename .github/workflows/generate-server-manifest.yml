name: Generate server manifest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - "server-ignore.txt"
      - ".github/workflows/generate-server-manifest.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate server-manifest.json
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path(".")
          manifest_path = root / "manifest.json"
          ignore_path = root / "server-ignore.txt"
          output_path = root / "server-manifest.json"

          if not manifest_path.is_file():
              raise SystemExit("manifest.json est introuvable.")

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          ignored_mods = set()

          if ignore_path.is_file():
              for raw_line in ignore_path.read_text(
                  encoding="utf-8"
              ).splitlines():
                  line = raw_line.strip()

                  if not line or line.startswith("#"):
                      continue

                  ignored_mods.add(
                      line.replace("\\", "/").lstrip("/")
                  )

          server_mods = []

          for entry in manifest.get("mods", []):
              relative_path = str(
                  entry.get("path", "")
              ).replace("\\", "/").lstrip("/")

              if not relative_path:
                  continue

              if relative_path in ignored_mods:
                  print(f"[EXCLU SERVEUR] mods/{relative_path}")
                  continue

              server_mods.append(entry)

          result = {
              "version": 1,
              "sourceManifest": "manifest.json",
              "mods": server_mods,
              "config": manifest.get("config", []),
              "defaultconfigs": manifest.get("defaultconfigs", []),
          }

          output_path.write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("server-manifest.json généré :")
          print(f"  mods           : {len(result['mods'])}")
          print(f"  config         : {len(result['config'])}")
          print(f"  defaultconfigs : {len(result['defaultconfigs'])}")

      - name: Commit server-manifest.json
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- server-manifest.json; then
            echo "Aucune modification de server-manifest.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server-manifest.json
          git commit -m "Update server manifest"
          git push
